project: "AI-Companion Language Learning Platform"
version: "1.0.0"
last_updated: "2026-10-28"
requirements:
  # ==========================================
  # INVARIANTS (Non-negotiable runtime rules)
  # ==========================================
  - id: "INV-SCOPE-001"
    type: "invariant"
    statement: "Every user message must pass through the bounded scope-control pipeline before retrieval or tutor-model invocation."
    fit_criterion: "100% of incoming chat requests log an upstream ScopeResult prior to any vector store or LLM client call."
    priority: "Must"
    tradeoff: "Adds bounded classification latency (100-300ms) on all requests to guarantee zero out-of-scope model invocations."
    enforcing_component: "src/backend/safety_boundary/scope_guard.py"
    verification_method: "test/offline/test_safety_boundary/test_scope_guard.py::test_scope_pipeline_execution_order"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2.1"

  - id: "INV-SCOPE-002"
    type: "invariant"
    statement: "A user request determined to be unrelated to language learning must receive the approved deterministic fixed refusal string."
    fit_criterion: "System returns exact string 'I\\'m sorry, but I can only help with language-learning questions.' with HTTP 200 and zero model-generated tokens."
    priority: "Must"
    tradeoff: "Refuses open-ended non-pedagogical conversation to prevent off-topic jailbreaks."
    enforcing_component: "src/backend/safety_boundary/scope_guard.py"
    verification_method: "test/offline/test_safety_boundary/test_scope_guard.py::test_fixed_refusal_response"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2.1"

  - id: "INV-SCOPE-003"
    type: "invariant"
    statement: "A deterministically rejected request must make exactly zero RAG vector searches and zero tutor LLM calls."
    fit_criterion: "Vector search mock call count == 0 and LLM API client call count == 0 for all rejected test cases."
    priority: "Must"
    tradeoff: "Prevents conversational recovery on rejected turns in exchange for complete cost and prompt injection containment."
    enforcing_component: "src/backend/api/routers/chat.py"
    verification_method: "test/offline/test_safety_boundary/test_scope_guard.py::test_zero_calls_on_rejection"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2.1"

  - id: "INV-SCOPE-004"
    type: "invariant"
    statement: "An uncertain intent request must return the approved fixed clarification response and must not bypass scope control."
    fit_criterion: "Ambiguous user inputs deterministically yield status='uncertain', zero external LLM calls, and a static clarification prompt."
    priority: "Must"
    tradeoff: "Requires user to rephrase ambiguous requests rather than guessing intent probabilistically."
    enforcing_component: "src/backend/safety_boundary/scope_guard.py"
    verification_method: "test/offline/test_safety_boundary/test_scope_guard.py::test_uncertain_intent_clarification"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2.1"

  - id: "INV-SCOPE-005"
    type: "invariant"
    statement: "A mixed-intent request must not silently execute an unsupported part and must return a fixed resubmission clarification."
    fit_criterion: "Inputs containing partial off-topic actions yield status='mixed' and zero retrieval or tutor calls."
    priority: "Must"
    tradeoff: "Rejects partially valid prompts requiring the user to isolate the language question."
    enforcing_component: "src/backend/safety_boundary/scope_guard.py"
    verification_method: "test/offline/test_safety_boundary/test_scope_guard.py::test_mixed_intent_blocking"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2.1"

  - id: "INV-SCOPE-006"
    type: "invariant"
    statement: "Retrieval from the vector database must be conditional and executed only when requires_grounding is true."
    fit_criterion: "Zero vector search calls executed for ungrounded conversation, writing feedback, vocabulary JSON lookup, or rejected states."
    priority: "Must"
    tradeoff: "Restricts vector retrieval strictly to lesson/grammar queries to minimize DB latency and token overhead."
    enforcing_component: "src/backend/ai_companion/retrieval_adapter.py"
    verification_method: "test/offline/test_ai_companion/test_retrieval_conditions.py::test_conditional_retrieval_routing"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 2.1"

  - id: "INV-AUTH-001"
    type: "invariant"
    statement: "Cross-user data access is strictly forbidden; all session, progress, and vocabulary queries must be scoped to the authenticated user ID."
    fit_criterion: "Access attempts using another user's session ID or user ID yield HTTP 403/404 with 0 record disclosures and 0 state mutations."
    priority: "Must"
    tradeoff: "Disallows public session sharing or collaborative peer review in MVP."
    enforcing_component: "src/backend/auth/security.py"
    verification_method: "test/offline/test_auth/test_authorization.py::test_cross_user_isolation"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 4 & 8.2"

  - id: "INV-LANG-001"
    type: "invariant"
    statement: "The application supports only the English language; all registration and profile requests with language != 'en' must be rejected."
    fit_criterion: "Payloads with language != 'en' fail with HTTP 422 Unprocessable Entity."
    priority: "Must"
    tradeoff: "Completely foregoes multilingual support in MVP to ensure high pedagogical rigor in English."
    enforcing_component: "src/backend/api/schemas/profile.py"
    verification_method: "test/offline/test_auth/test_profile.py::test_reject_non_english"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 0"

  - id: "INV-CEFR-001"
    type: "invariant"
    statement: "The system accepts only canonical CEFR levels A1, A2, B1, and B2; any other level values must be rejected at the API boundary."
    fit_criterion: "Payloads containing levels outside ['A1', 'A2', 'B1', 'B2'] fail schema validation with HTTP 422."
    priority: "Must"
    tradeoff: "Excludes advanced C1/C2 learners in MVP to bound content and evaluation complexity."
    enforcing_component: "src/backend/api/schemas/profile.py"
    verification_method: "test/offline/test_auth/test_profile.py::test_reject_invalid_cefr"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 0"

  - id: "INV-SEC-001"
    type: "invariant"
    statement: "The runtime application service must use read-only vector database credentials and cannot execute insert, update, or delete commands."
    fit_criterion: "Direct SQL/vector write operations executed via the application DB pool raise a permission-denied exception."
    priority: "Must"
    tradeoff: "Requires a separate offline admin script for corpus reindexing; runtime cannot dynamically ingest materials."
    enforcing_component: "src/backend/database/vector_client.py"
    verification_method: "test/offline/test_database/test_vector_permissions.py::test_runtime_vector_read_only"
    owner: "Member 5 (Luming)"
    source: "CS5351 Project Plan Section 3.1 & 4"

  - id: "INV-SEC-002"
    type: "invariant"
    statement: "The web application and backend API must expose zero user file upload endpoints."
    fit_criterion: "API router introspection test confirms 0 registered routes accepting multipart/form-data or file payloads."
    priority: "Must"
    tradeoff: "Learners cannot upload custom documents or essays as PDF/Word files in the MVP."
    enforcing_component: "src/backend/main.py"
    verification_method: "test/offline/test_api/test_routes.py::test_no_upload_endpoints_exposed"
    owner: "Member 5 (Luming)"
    source: "CS5351 Project Plan Section 3.1"

  - id: "INV-PROG-001"
    type: "invariant"
    statement: "Dashboard progress metrics must be aggregated deterministically from verified database events and never from LLM output."
    fit_criterion: "Progress response counts exactly match SQL COUNT(*) queries from learning_events table."
    priority: "Must"
    tradeoff: "Dashboard displays strictly quantified counts rather than personalized AI narrative summaries."
    enforcing_component: "src/backend/user_progress/service.py"
    verification_method: "test/offline/test_user_progress/test_dashboard.py::test_progress_derived_from_events"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2 & 8.4"

  - id: "INV-CITE-001"
    type: "invariant"
    statement: "All displayed lesson citations must match retrieved, published chunk IDs; invalid or missing source IDs must trigger safe abstention."
    fit_criterion: "Tutor responses with unverified citation IDs are discarded; response falls back to an insufficient-evidence disclosure."
    priority: "Must"
    tradeoff: "Abstains from answering if citation integrity fails, preventing hallucinated learning claims."
    enforcing_component: "src/backend/safety_boundary/citation_validator.py"
    verification_method: "test/offline/test_safety_boundary/test_citation_validator.py::test_reject_invalid_citations"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.2"

  # ==========================================
  # FUNCTIONAL REQUIREMENTS
  # ==========================================
  - id: "FR-AUTH-001"
    type: "functional"
    statement: "The system shall allow users to register and log in, issuing a secure session cookie or token."
    fit_criterion: "POST /auth/register and POST /auth/login return HTTP 200 with valid session token upon correct credentials."
    priority: "Must"
    tradeoff: "Uses standard password authentication; third-party OAuth is deferred."
    enforcing_component: "src/backend/auth/router.py"
    verification_method: "test/offline/test_auth/test_auth_flow.py::test_register_login"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2 & 8.5"

  - id: "FR-PROF-001"
    type: "functional"
    statement: "The system shall allow users to view and update their profile with learning goals and CEFR level (A1-B2)."
    fit_criterion: "PATCH /me updates CEFR level and persists to database; invalid values return HTTP 422."
    priority: "Must"
    tradeoff: "CEFR level is self-selected; automated placement test is deferred."
    enforcing_component: "src/backend/auth/router.py"
    verification_method: "test/offline/test_auth/test_profile.py::test_update_profile"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2 & 8.5"

  - id: "FR-CHAT-001"
    type: "functional"
    statement: "The system shall provide a text-based conversational practice session tailored to the learner's CEFR level and selected topic."
    fit_criterion: "POST /sessions/{id}/messages in conversation mode returns assistant response conforming to ChatResponseSchema within token budget."
    priority: "Must"
    tradeoff: "Restricted to text dialogue; speech synthesis and audio input are deferred."
    enforcing_component: "src/backend/ai_companion/tutor.py"
    verification_method: "test/offline/test_ai_companion/test_tutor.py::test_guided_conversation_flow"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 2 & 8.5"

  - id: "FR-FEED-001"
    type: "functional"
    statement: "The system shall analyze learner-submitted text, returning structured grammar and writing corrections while keeping original text intact."
    fit_criterion: "Writing feedback responses include original text, identified errors, suggested revisions, and grammatical explanations."
    priority: "Must"
    tradeoff: "Evaluates individual submissions without retaining long-term cross-session writing portfolios."
    enforcing_component: "src/backend/grammar/evaluator.py"
    verification_method: "test/offline/test_grammar/test_evaluator.py::test_writing_feedback_structure"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 2 & 8.5"

  - id: "FR-RAG-001"
    type: "functional"
    statement: "The system shall ground English lesson and grammar questions against approved vector chunks and present verifiable citations."
    fit_criterion: "Responses to grounded queries include valid source_id and section title referencing approved lesson corpus."
    priority: "Must"
    tradeoff: "Answers only questions substantiated by the 5-10 MVP lessons; ungrounded questions trigger abstention."
    enforcing_component: "src/backend/ai_companion/rag_pipeline.py"
    verification_method: "test/offline/test_ai_companion/test_rag.py::test_grounded_answer_citation"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.2"

  - id: "FR-VOC-001"
    type: "functional"
    statement: "The system shall randomly select published English vocabulary cards from the verified JSON dataset matching level and topic."
    fit_criterion: "GET /vocabulary/random returns requested count of entries with review_status='published'; identical seed yields identical entries."
    priority: "Must"
    tradeoff: "Serves pre-reviewed JSON entries rather than generating real-time vocabulary with LLMs."
    enforcing_component: "src/backend/vocabulary/loader.py"
    verification_method: "test/offline/test_vocabulary/test_loader.py::test_random_selection_with_seed"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2 & 8.6"

  - id: "FR-VOC-002"
    type: "functional"
    statement: "The system shall record user familiarity state ('learning', 'familiar', 'mastered') for reviewed vocabulary entries."
    fit_criterion: "POST /me/vocabulary/{entry_id} updates familiarity state in user_vocabulary table and emits a learning event."
    priority: "Must"
    tradeoff: "Simple 3-tier familiarity state; full SuperMemo-2 spaced-repetition algorithm is deferred."
    enforcing_component: "src/backend/vocabulary/service.py"
    verification_method: "test/offline/test_vocabulary/test_service.py::test_record_familiarity"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 2 & 8.4"

  - id: "FR-DASH-001"
    type: "functional"
    statement: "The system shall display a dashboard summarizing user learning events, completed sessions, and mastered vocabulary."
    fit_criterion: "GET /me/progress returns valid JSON matching DashboardMetricsSchema containing non-negative event aggregates."
    priority: "Must"
    tradeoff: "Static aggregation cards; predictive learning analytics and grade charts are deferred."
    enforcing_component: "src/backend/user_progress/service.py"
    verification_method: "test/offline/test_user_progress/test_dashboard.py::test_dashboard_metrics_aggregation"
    owner: "Member 4 (Henry)"
    source: "CS5351 Project Plan Section 2 & 8.5"

  - id: "FR-CORP-001"
    type: "functional"
    statement: "The system shall provide an offline admin command to validate, chunk, embed, and transactionally index approved lesson documents."
    fit_criterion: "Running scripts/ingest_content.py --manifest content/manifest.yaml indexes chunks without error and outputs an audit report."
    priority: "Should"
    tradeoff: "Requires CLI execution by team maintainers; no web-based CMS interface provided."
    enforcing_component: "scripts/ingest_content.py"
    verification_method: "test/offline/test_scripts/test_ingestion.py::test_admin_ingest_pipeline"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.1 & 8.7"

  # ==========================================
  # NON-FUNCTIONAL REQUIREMENTS
  # ==========================================
  - id: "NFR-PERF-001"
    type: "performance"
    statement: "Tutor response generation p95 latency shall not exceed 12.0 seconds in the test environment."
    fit_criterion: "95% of requests in automated load test suite complete with HTTP 200 in <= 12.0s."
    priority: "Must"
    tradeoff: "Caps maximum generated token length and retrieval candidates to meet latency targets."
    enforcing_component: "src/backend/ai_companion/tutor.py"
    verification_method: "test/live/test_latency.py::test_p95_response_latency"
    owner: "Member 5 (Luming)"
    source: "CS5351 Project Plan Section 3.3"

  - id: "NFR-QUAL-001"
    type: "quality"
    statement: "The RAG pipeline shall achieve a retrieval recall@5 score of at least 0.85 across the fixed benchmark evaluation dataset."
    fit_criterion: "Automated retrieval evaluation on evaluation_set.json yields recall@5 >= 0.85."
    priority: "Must"
    tradeoff: "Requires upfront manual annotation of 15-25 evaluation queries and gold chunk IDs."
    enforcing_component: "src/backend/ai_companion/retrieval_adapter.py"
    verification_method: "test/offline/test_ai_companion/test_retrieval_eval.py::test_recall_at_5"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.3"

  - id: "NFR-QUAL-002"
    type: "quality"
    statement: "Grounded responses must achieve a pedagogical correctness score >= 0.80 when evaluated against source lesson points."
    fit_criterion: "Semantic evaluation replay on fixed grounded evaluation set achieves score >= 0.80."
    priority: "Must"
    tradeoff: "Enforces strict rubric grading; borderline or ungrounded claims are penalized."
    enforcing_component: "src/backend/safety_boundary/evaluator.py"
    verification_method: "test/live/test_semantic_eval.py::test_grounded_correctness"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.3"

  - id: "NFR-QUAL-003"
    type: "quality"
    statement: "Citation validity shall be 100% with zero hallucinated source IDs across all generated responses."
    fit_criterion: "100% of source_ids present in API responses match an active chunk in the retrieved candidate set."
    priority: "Must"
    tradeoff: "Responses with invalid citation format or unknown IDs are immediately discarded."
    enforcing_component: "src/backend/safety_boundary/citation_validator.py"
    verification_method: "test/offline/test_safety_boundary/test_citation_validator.py::test_zero_hallucinated_citations"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.3"

  - id: "NFR-QUAL-004"
    type: "quality"
    statement: "The system shall achieve 100% refusal accuracy on the fixed unambiguous off-topic test dataset."
    fit_criterion: "All off-topic test cases in test/fixtures/off_topic_queries.json return status='rejected' and the exact fixed refusal string."
    priority: "Must"
    tradeoff: "May occasionally reject borderline edge cases to preserve zero tolerance on clear off-topic prompts."
    enforcing_component: "src/backend/safety_boundary/scope_guard.py"
    verification_method: "test/offline/test_safety_boundary/test_scope_guard.py::test_off_topic_refusal_accuracy"
    owner: "Member 3 (Kapo)"
    source: "CS5351 Project Plan Section 3.3"

  - id: "NFR-SEC-001"
    type: "security"
    statement: "Zero safety policy escapes shall occur when executing the fixed adversarial prompt injection test suite."
    fit_criterion: "Adversarial evaluation replay yields 0 escapes; system prompt instructions cannot be extracted or overridden."
    priority: "Must"
    tradeoff: "Retrieved text is treated strictly as untrusted data and isolated from system instruction blocks."
    enforcing_component: "src/backend/ai_companion/prompt_assembly.py"
    verification_method: "test/offline/test_safety_boundary/test_prompt_injection.py::test_zero_policy_escapes"
    owner: "Member 5 (Luming)"
    source: "CS5351 Project Plan Section 3.3"

  - id: "NFR-COST-001"
    type: "cost"
    statement: "Context window assembly shall enforce a strict ceiling of 1,500 total prompt tokens per turn with automated history compaction."
    fit_criterion: "Token counter assertion verifies assembled prompt token length <= 1,500 across all session turns."
    priority: "Must"
    tradeoff: "Compacts or truncates older conversational history turns after 6 messages."
    enforcing_component: "src/backend/ai_companion/prompt_assembly.py"
    verification_method: "test/offline/test_ai_companion/test_token_budget.py::test_token_cap_enforcement"
    owner: "Member 2 (Leon)"
    source: "CS5351 Project Plan Section 3.2 & 4"

  - id: "NFR-GOV-001"
    type: "governance"
    statement: "The CI/CD pipeline shall enforce all 6 mandatory blocking gates on all pull requests touching main."
    fit_criterion: "GitHub Actions workflow passes Test Approval, Static Analysis, Schema, Semantic Eval, Regression, and AI-Log gates."
    priority: "Must"
    tradeoff: "Strict PR merge friction; pull requests without prior tests or log updates are blocked."
    enforcing_component: ".github/workflows/ci.yml"
    verification_method: "test/offline/test_governance/test_ci_config.py::test_blocking_gates_declared"
    owner: "Member 5 (Luming)"
    source: "CS5351 Project Specification Section 6"

  - id: "NFR-GOV-002"
    type: "governance"
    statement: "Every pull request that modifies code or prompts must include an updated entry in docs/code-governance/ai-use-log.yaml."
    fit_criterion: "CI Gate 6 fails with exit code 1 if git diff touches src/ or prompts/ without touching ai-use-log.yaml."
    priority: "Must"
    tradeoff: "Requires manual logging overhead for every AI coding turn."
    enforcing_component: ".github/workflows/ci.yml"
    verification_method: "test/offline/test_governance/test_ai_log.py::test_log_gate_script"
    owner: "Member 1 (Adrian)"
    source: "CS5351 Project Specification Section 6"
