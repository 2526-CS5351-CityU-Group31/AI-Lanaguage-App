prd_metadata:
  title: "AI-Companion Language Learning Platform — Product Requirements Document"
  project_code: "CS5351-APP"
  version: "1.0.0"
  target_deadline: "Late November 2026"
  target_audience: "English language learners practicing CEFR levels A1 through B2"

scope_and_boundaries:
  target_language: "en"
  supported_cefr_levels:
    - "A1"
    - "A2"
    - "B1"
    - "B2"
  excluded_from_release_1:
    - "Speech recognition and pronunciation analysis"
    - "Live video or audio streaming"
    - "Teacher grading and human-in-the-loop portal"
    - "General web search / ungrounded internet queries"
    - "End-user file uploads (PDF, DOCX, TXT)"
    - "Languages other than English"

genuine_ai_components:
  tutor_engine:
    description: "LLM-powered conversational language practice and writing correction adapter."
    authority: "Advisory"
  rag_pipeline:
    description: "Retrieval-augmented generation over 5-10 human-reviewed English lesson documents."
    authority: "Advisory"

deterministic_safety_boundaries:
  scope_guard:
    description: "Pre-execution classifier evaluating intent and blocking non-pedagogical requests."
    authority: "Authoritative"
    fixed_refusal_text: "I'm sorry, but I can only help with language-learning questions."
  citation_validator:
    description: "Deterministic validator confirming cited source IDs exist in retrieved chunk set."
    authority: "Authoritative"
  data_isolation:
    description: "Tenant and user isolation enforcing principal-based record scoping in PostgreSQL."
    authority: "Authoritative"
  vector_store_permissions:
    description: "Application service uses read-only credentials; runtime writes are denied."
    authority: "Authoritative"

dataset_specifications:
  vocabulary_dataset:
    format: "JSON"
    storage_path: "content/vocabulary_en.json"
    initial_volume: "50-100 reviewed and published entries"
    runtime_access: "Read-only"
    test_requirement: "Must support fixed random seed for reproducibility"
  lesson_corpus:
    format: "Markdown / Text chunks"
    initial_volume: "5-10 reviewed lesson documents"
    storage_path: "content/lessons/"
    ingestion_mode: "Offline admin CLI script"

core_user_journeys:
  - id: "UJ-01"
    name: "Onboarding & Profile Setup"
    steps:
      - "User registers with email/password."
      - "System sets language='en' and user selects CEFR level (A1-B2)."
      - "User profile is stored with strict ownership scoping."
  - id: "UJ-02"
    name: "Guided Conversation Practice"
    steps:
      - "User chooses practice topic and enters a message."
      - "Scope guard confirms language_learning intent."
      - "AI tutor responds with level-appropriate English dialogue."
  - id: "UJ-03"
    name: "Writing & Grammar Feedback"
    steps:
      - "User submits written sentence or paragraph for correction."
      - "Scope guard classifies intent as writing_feedback."
      - "System returns structured corrections, explanations, and preserves original text."
  - id: "UJ-04"
    name: "Grounded Lesson Inquiry"
    steps:
      - "User asks a specific grammar or lesson rule question."
      - "System verifies requires_grounding=true and searches read-only vector store."
      - "AI tutor provides answer citing approved source_ids."
      - "Citation validator verifies source IDs before presenting response."
  - id: "UJ-05"
    name: "Vocabulary Flashcard Review"
    steps:
      - "User requests vocabulary cards for current level."
      - "System randomly selects eligible entries from approved JSON dataset."
      - "User reviews definition, example, and updates familiarity state."
  - id: "UJ-06"
    name: "Progress Review"
    steps:
      - "User navigates to progress dashboard."
      - "System deterministically queries learning_events table and renders aggregate metrics."
