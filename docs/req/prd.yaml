# Product requirements brief - AI Language Learning Platform (LANG)
# Companion to requirements.yaml. This file carries context and product intent;
# requirements.yaml owns every testable requirement. If the two disagree, requirements.yaml wins.
schema_version: "1.0"
project: LANG
product: "Grounded English tutor for Chinese-speaking learners"
release: R1
status: baselined
date: 2026-10-27
owner: "Member 1 (Requirements & PM)"
baseline_ref: docs/req/requirements.yaml

problem:
  statement: "Chinese-speaking learners need low-pressure English practice with feedback they can trust and progress they can see."
  failure_today: "Generic chatbots answer fluently but invent rules, cannot show which lesson supports an answer, and blur what the learner actually mastered."

target_learner:
  primary: "Adult learners of English at CEFR A1-B1, comfortable reading simplified Chinese explanations."
  device: "Desktop browser first; 360 px responsive layout is in scope, native apps are not."
  session: "10-20 minutes, 1-3 times per week, alone."
  assumptions:
    - "Learners value source-grounded explanations over open-ended chat."
    - "A small reviewed corpus is sufficient for the first release."
    - "Typing is acceptable; speech is out of scope."

value:
  - "Practice conversation on a chosen topic and level."
  - "Receive writing feedback that preserves the original and labels AI suggestions."
  - "Ask about a taught rule and see the lesson title and section behind the answer."
  - "Review saved vocabulary and take short quizzes scored by the server."
  - "See progress computed from stored learning events, not model prose."

non_goals:
  - "Speech recognition, pronunciation scoring, or live video."
  - "Multiple target languages or a broad multilingual curriculum."
  - "Teacher portal, classroom management, payments, or certification."
  - "Open web browsing or general-purpose assistant behaviour."
  - "Social features, leaderboards, or learner-to-learner sharing."

personas:
  - id: P-LEARNER
    name: "Learner"
    goals: ["Practise without embarrassment", "Understand why a sentence is wrong", "See measurable progress"]
    permissions: ["Own profile, own sessions, own vocabulary, own quizzes, own dashboard"]
  - id: P-REVIEWER
    name: "Content reviewer"
    goals: ["Publish only licensed, accurate lessons", "Retire outdated material without serving stale citations"]
    permissions: ["Ingest, preview, publish, retire content sources; not learner records"]
  - id: P-OPERATOR
    name: "Operator"
    goals: ["Keep the demo within budget", "Diagnose failures without reading private writing"]
    permissions: ["Read redacted operational metrics, pause AI features, roll back a content or prompt version"]

journeys:
  - id: J-1
    name: "First practice session"
    steps:
      - "Register or log in; choose English, level and a topic."
      - "Start a session and exchange at least three text turns."
      - "Receive a follow-up question and an optional tip."
      - "Close the session and see it listed in history."
    requirements: [REQ-LANG-FR-001, REQ-LANG-FR-002, REQ-LANG-NFR-004]
  - id: J-2
    name: "Grounded rule question"
    steps:
      - "Ask when to use the present perfect."
      - "See an answer citing one or more published lesson sections."
      - "Open the citation and read the source section."
      - "If the corpus lacks evidence, see an explicit limitation and a practice alternative."
    requirements: [REQ-LANG-FR-003, REQ-LANG-FR-004, REQ-LANG-INV-002]
  - id: J-3
    name: "Writing feedback"
    steps:
      - "Submit a short paragraph."
      - "See the original, a suggested rewrite, an explanation and examples."
      - "Accept or dismiss the suggestion; the original is never overwritten."
    requirements: [REQ-LANG-FR-005, REQ-LANG-SEC-004]
  - id: J-4
    name: "Vocabulary and quiz"
    steps:
      - "Save a candidate word from a session or lesson and confirm its sense."
      - "Review the word later and mark familiarity."
      - "Take a short quiz; answers are checked server-side."
      - "See the explanation and the next recommended practice."
    requirements: [REQ-LANG-FR-006, REQ-LANG-FR-007, REQ-LANG-INV-004]
  - id: J-5
    name: "Progress review"
    steps:
      - "Open the dashboard."
      - "See sessions, reviewed words, quiz results and recent topics."
      - "Every total matches the stored learning events."
    requirements: [REQ-LANG-FR-008, REQ-LANG-INV-005]
  - id: J-6
    name: "Content publication"
    steps:
      - "Reviewer ingests a licensed lesson through a dry run."
      - "Preview chunks and metadata, then publish a new version."
      - "Retire the previous version; the next retrieval excludes it."
    requirements: [REQ-LANG-FR-010, REQ-LANG-GOV-001, REQ-LANG-ARCH-003]

data_inventory:
  - store: "users, profiles"
    content: "Email/login identity, display name, target language, level, goals"
    personal: true
    retention: "Until account deletion; 30-day deletion grace"
    requirements: [REQ-LANG-FR-001, REQ-LANG-SEC-003]
  - store: "sessions, messages"
    content: "Learner turns and validated tutor turns, model/prompt versions"
    personal: true
    retention: "12 months after last activity"
    requirements: [REQ-LANG-FR-002, REQ-LANG-GOV-002]
  - store: "writing_submissions, feedback"
    content: "Original paragraph, validated suggestion, accept/dismiss state"
    personal: true
    retention: "12 months after last activity"
    requirements: [REQ-LANG-FR-005]
  - store: "vocabulary, user_vocabulary"
    content: "Word, sense, level, definition, example, review state"
    personal: "Partially (user_vocabulary)"
    retention: "Until account deletion"
    requirements: [REQ-LANG-FR-006]
  - store: "quizzes, quiz_items, attempts"
    content: "Items, server-held keys, responses, scores"
    personal: "Attempts only"
    retention: "12 months"
    requirements: [REQ-LANG-FR-007, REQ-LANG-INV-004]
  - store: "content_sources, content_chunks"
    content: "Licensed lesson text, metadata, checksums, versions, embeddings"
    personal: false
    retention: "Published versions indefinitely; retired versions 24 months for audit"
    requirements: [REQ-LANG-FR-010, REQ-LANG-GOV-001, REQ-LANG-SEC-004]
  - store: "learning_events"
    content: "Event type, user reference, object reference, timestamp"
    personal: "Reference only"
    retention: "24 months"
    requirements: [REQ-LANG-FR-008, REQ-LANG-INV-005]
  - store: "observability_events"
    content: "Request id, versions, validation result, retrieval ids, latency, tokens, cost"
    personal: "Redacted references only"
    retention: "30 days operational, 90 days security, 13 months daily cost aggregates"
    requirements: [REQ-LANG-GOV-002, REQ-LANG-SEC-004]

success_metrics:
  - metric: citation_validity
    target: "100%"
    source: "evals/EVAL-1.0.0.yaml"
  - metric: retrieval_recall_at_5
    target: ">= 0.85"
    source: "evals/EVAL-1.0.0.yaml"
  - metric: grounded_answer_correctness
    target: ">= 0.80 human-scored"
    source: "evals/EVAL-1.0.0.yaml"
  - metric: cross_user_exposure_count
    target: "0"
    source: "test/offline/invariants"
  - metric: policy_escape_count
    target: "0"
    source: "evals/EVAL-1.0.0.yaml adversarial cases"
  - metric: tutor_response_p95_seconds
    target: "<= 12 s"
    source: "scripts/bench_tutor_latency.py"
  - metric: session_cost_usd
    target: "<= US$0.04"
    source: "scripts/report_cost.py"

scope_in_r1:
  - "One target language: English for Chinese-speaking learners (interface labels may be Chinese)."
  - "Text-only web application: onboarding, chat, writing, vocabulary, quiz, dashboard, content admin."
  - "Small reviewed corpus: 12 lessons (>= 80 chunks) and 300 vocabulary entries at release."
  - "One API, one PostgreSQL database, pgvector embeddings, hosted LLM behind an adapter."
  - "Offline deterministic tests plus a controlled live evaluation."

scope_out_r1:
  - "Speech, pronunciation, multiple languages, teacher portal, payments, web browsing, social features."
  - "Mobile native apps, offline mode, real-time collaborative features."
  - "Fine-tuning or training on learner data."

assumptions:
  - id: A-001
    statement: "The hosted PostgreSQL plan supports pgvector; if not, ADR-007 is reopened before Sprint 3."
    risk: R-006
  - id: A-002
    statement: "A 24-question grounded set gives a usable first signal; confidence interval is recorded with the score."
    risk: R-009
  - id: A-003
    statement: "Team-authored or licensed lessons can be published with provenance before the demo."
    risk: R-004
  - id: A-004
    statement: "The chosen LLM provider offers a stable model identifier and latency suitable for a 12 s p95."
    risk: R-002

open_questions:
  - id: Q-001
    question: "Confirm the five member names and student IDs before Sprint 1 sign-off."
    owner: "Member 1"
  - id: Q-002
    question: "Confirm hosted PostgreSQL supports pgvector at the selected plan and region."
    owner: "Member 3"
  - id: Q-003
    question: "Confirm the corpus licence allows hosting and derived embeddings for the course demo."
    owner: "Member 2"
  - id: Q-004
    question: "Confirm whether the course requires deployment beyond local Docker Compose."
    owner: "Member 5"
