name: CI Blocking Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # Gate 1: Test Approval.
  # Placeholder: check_test_approval.py is not implemented yet (DBT-002). The
  # approval artifact location/format is not specified in the docs, so this gate
  # does not block until that is confirmed.
  gate-1-test-approval:
    name: "Gate 1: Test Approval"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Test Approval (placeholder, non-blocking)
        run: |
          echo "Placeholder: check_test_approval.py not implemented yet (DBT-002)."
          echo "Approval artifact location pending confirmation; this gate does not block."

  # Gate 2: Static Analysis.
  # Type checking and a syntax compile run on every commit. The extra
  # contract/security/API-surface checks for safety paths are not implemented yet.
  gate-2-static-analysis:
    name: "Gate 2: Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Analysis Tools
        run: pip install mypy
      - name: Byte-compile Python Sources (syntax lint)
        run: |
          if [ -d src ]; then python -m compileall -q src; fi
          if [ -d scripts ]; then python -m compileall -q scripts; fi
      - name: Strict Type Checking
        run: |
          if [ -d src ]; then
            mypy --strict src
          else
            echo "No src directory; skipping type check."
          fi

  # Gate 3: Schema Gate. Validates the requirements registry against its schema.
  gate-3-schema:
    name: "Gate 3: Schema Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Validation Dependencies
        run: pip install jsonschema pyyaml
      - name: Validate Requirements Registry
        run: python scripts/validate_req.py docs/req/requirements.yaml

  # Gate 4: Semantic Evaluation.
  # Placeholder: run_eval.py is not implemented yet (DBT-001), so this gate does
  # not block until the fixed evaluation set and thresholds are wired.
  gate-4-semantic-evaluation:
    name: "Gate 4: Semantic Evaluation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Semantic Evaluation (placeholder, non-blocking)
        run: |
          echo "Placeholder: run_eval.py not implemented yet (DBT-001); this gate does not block."

  # Gate 5: Regression Gate. Runs the full deterministic offline suite.
  gate-5-regression:
    name: "Gate 5: Regression"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Test Dependencies
        run: pip install pytest pyyaml
      - name: Run Offline Regression Suite
        run: |
          if find test/offline -name 'test_*.py' | grep -q .; then
            pytest test/offline -q
          else
            echo "No offline tests collected; nothing to run yet."
          fi

  # Gate 6: AI-use Log Gate. A PR changing code/prompts without updating the log
  # is blocked, and the log itself must be schema-valid with append-only history.
  gate-6-ai-use-log:
    name: "Gate 6: AI-use Log"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Validation Dependencies
        run: pip install jsonschema pyyaml
      - name: Require Log Update for Code/Prompt Changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          CODE_OR_PROMPT_CHANGED=false
          LOG_UPDATED=false
          for file in $CHANGED_FILES; do
            if [[ "$file" =~ ^(src/|prompts/|Prompt\.md) ]]; then
              CODE_OR_PROMPT_CHANGED=true
            fi
            if [[ "$file" == "docs/code-governance/ai-use-log.yaml" ]]; then
              LOG_UPDATED=true
            fi
          done
          if [ "$CODE_OR_PROMPT_CHANGED" = true ] && [ "$LOG_UPDATED" = false ]; then
            echo "::error::Gate 6 Failed: code or prompts changed without updating docs/code-governance/ai-use-log.yaml."
            exit 1
          fi
          echo "AI-use log update check passed."
      - name: Validate AI-use Log
        run: python scripts/check_ai_log.py
