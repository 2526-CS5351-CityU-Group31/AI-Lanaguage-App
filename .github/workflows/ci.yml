name: CI Blocking Gates

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  # Gate 1: Test Approval. A PR may not carry implementation commits written before
  # a named human approved the plan and its tests. The human commits
  # docs/code-governance/approvals/PR-<number>.yaml before coding (ci-gates-design.md
  # A.1) and this job proves the order (VS-18).
  gate-1-test-approval:
    name: "Gate 1: Test Approval"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gate Dependencies
        run: pip install pyyaml
      - name: Fetch Base Branch
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Check Test Approval
        run: python scripts/check_test_approval.py --pr ${{ github.event.pull_request.number }} --base origin/${{ github.base_ref }}

  # Gate 2: Static Analysis.
  # Type checking and a syntax compile run on every commit. The extra
  # contract/security/API-surface checks for safety paths are not implemented yet.
  gate-2-static-analysis:
    name: "Gate 2: Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Project dependencies are required so mypy can resolve real stubs for
      # fastapi, pydantic, psycopg and uvicorn; without them every third-party
      # symbol is Any and --strict reports spurious errors.
      - name: Install Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Byte-compile Python Sources (syntax lint)
        run: |
          if [ -d src ]; then python -m compileall -q src; fi
          if [ -d scripts ]; then python -m compileall -q scripts; fi
      - name: Strict Type Checking
        env:
          MYPYPATH: src
        run: |
          if [ -d src ]; then
            mypy --strict src
          else
            echo "No src directory; skipping type check."
          fi

  # Gate 3: Schema Gate. Validates the requirements registry against its schema.
  gate-3-schema:
    name: "Gate 3: Schema Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Validation Dependencies
        run: pip install jsonschema pyyaml
      - name: Validate Requirements Registry
        run: python scripts/validate_req.py docs/req/requirements.yaml

  # Gate 4: Semantic Evaluation. The suite (evals/EVAL-1.0.0.yaml) carries two active
  # offline cases; `pending` metrics are reported and never block a PR. The live tier
  # runs at release only and fails closed when credentials or measurements are missing
  # (ci-gates-design.md B.1-B.4).
  gate-4-semantic-evaluation:
    name: "Gate 4: Semantic Evaluation (offline)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Evaluation Dependencies
        run: pip install pytest pyyaml
      - name: Run Offline Semantic Evaluation
        run: python scripts/run_eval.py --suite evals/EVAL-1.0.0.yaml --offline
      - name: Upload Offline Evaluation Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-evidence-offline
          path: reports/eval/
          retention-days: 90

  gate-4-live-semantic-evaluation:
    name: "Gate 4: Semantic Evaluation (live, release)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Evaluation Dependencies
        run: pip install pytest pyyaml
      - name: Run Live Semantic Evaluation
        env:
          LLM_MODE: live
          LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
        run: python scripts/run_eval.py --suite evals/EVAL-1.0.0.yaml --live
      - name: Upload Live Evaluation Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-evidence-live
          path: reports/eval/
          retention-days: 90

  # Gate 5: Regression Gate. Runs the full deterministic offline suite.
  gate-5-regression:
    name: "Gate 5: Regression"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The API modules import fastapi/pydantic and the Postgres repositories
      # import psycopg, so the gate needs the runtime dependencies as well.
      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Run Offline Regression Suite
        run: |
          if find test/offline -name 'test_*.py' | grep -q .; then
            pytest test/offline -q
          else
            echo "No offline tests collected; nothing to run yet."
          fi

  # Gate 6: AI-use Log Gate. A PR changing code/prompts without updating the log
  # is blocked, and the log itself must be schema-valid with append-only history.
  gate-6-ai-use-log:
    name: "Gate 6: AI-Use Log Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Validation Dependencies
        run: pip install jsonschema pyyaml
      - name: Require Log Update for Code/Prompt Changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          CODE_OR_PROMPT_CHANGED=false
          LOG_UPDATED=false
          for file in $CHANGED_FILES; do
            if [[ "$file" =~ ^(src/|prompts/|Prompt\.md) ]]; then
              CODE_OR_PROMPT_CHANGED=true
            fi
            if [[ "$file" == "docs/code-governance/ai-use-log.yaml" ]]; then
              LOG_UPDATED=true
            fi
          done
          if [ "$CODE_OR_PROMPT_CHANGED" = true ] && [ "$LOG_UPDATED" = false ]; then
            echo "::error::Gate 6 Failed: code or prompts changed without updating docs/code-governance/ai-use-log.yaml."
            exit 1
          fi
          echo "AI-use log update check passed."
      - name: Validate AI-use Log
        run: python scripts/check_ai_log.py
